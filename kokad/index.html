<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="author" content="Aleksandr Saaroja">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Iru köök – kogused</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f6b4f'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle'%3E🍲%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#23302a;--mute:#6b766f;--accent:#2f6b4f;--accent-ink:#fff;--line:#e3ded2;--chip:#eaf2ec;--warn:#9a5b00;--warn-bg:#fff3dc}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1e2723;--ink:#e8eee9;--mute:#9aa8a0;--accent:#5fb589;--accent-ink:#0d1a13;--line:#2c3832;--chip:#25362d;--warn:#f0b968;--warn-bg:#3a2f1a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:18px;margin:0;font-weight:700}
.sub{font-size:13px;opacity:.85}
.nav{display:flex;gap:6px}
.nav button{background:rgba(255,255,255,.18);color:inherit;border:0;border-radius:10px;min-width:44px;height:40px;font-size:18px;font-weight:600;padding:0 12px}
.nav button:active{background:rgba(255,255,255,.32)}
.days{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:1 0 auto;min-width:46px;border:0;border-radius:12px;padding:6px 4px;background:rgba(255,255,255,.14);color:inherit;text-align:center;font:inherit}
.day b{display:block;font-size:14px}
.day span{font-size:12px;opacity:.85}
.day.sel{background:var(--card);color:var(--accent)}
.day.today b::after{content:" •"}
main{padding:14px 16px 28px;max-width:640px;margin:0 auto}
h2.date{font-size:20px;margin:4px 0 12px}
.meal{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.meal.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.meal h3{margin:0;padding:10px 14px;font-size:14px;letter-spacing:.04em;background:var(--chip);color:var(--accent);display:flex;justify-content:space-between}
.meal h3 em{font-style:normal;opacity:.9}
ul{list-style:none;margin:0;padding:4px 14px 8px}
li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li .n{font-weight:600;overflow-wrap:anywhere}
li .q{color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:15px}
li.bread .n{font-weight:400;color:var(--mute)}
li.var .n{font-weight:500}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:1px 6px;margin-right:6px;background:var(--warn-bg);color:var(--warn);vertical-align:1px}
.notes{font-size:13px;color:var(--mute);margin-top:16px}
.notes p{margin:4px 0}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.wk{font-size:13px;opacity:.9}

.tabs{display:flex;gap:6px;margin:10px 16px 0;max-width:608px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--accent);font:600 16px system-ui;background:var(--card);color:var(--accent)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.chip b{display:block;font-size:22px;line-height:1.1}
.chip span{font-size:11px;color:var(--mute)}
.qrow{border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;cursor:pointer;list-style:none}
.qrow summary::-webkit-details-marker{display:none}
.qn{font-weight:600;overflow-wrap:anywhere}
.qn small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.qt{font-size:22px;font-weight:800;white-space:nowrap;color:var(--accent);font-variant-numeric:tabular-nums}
.qd{padding:0 0 12px;font-size:15px}
.qd .ln{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
.qd label{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--mute);font-size:14px}
.qd input{width:80px;text-align:right;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.tag.pur{background:var(--chip);color:var(--accent)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:8px 12px;font-size:13px;margin:8px 0}
.dtab{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.dtab th{font-size:11px;font-weight:600;color:var(--mute);text-align:right;padding:6px 4px}
.dtab th:first-child,.dtab td:first-child{text-align:left}
.dtab td{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}
.dtab td.pu{font-weight:800;color:var(--accent)}
.dtab tr.tot td{font-weight:800;border-top:2px solid var(--line)}
.copy{max-width:640px;margin:0 auto;padding:6px 16px calc(20px + env(safe-area-inset-bottom));font-size:12px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1>Iru köök</h1><div class="sub" id="sub"></div></div>
    <div class="nav"><button id="prev" aria-label="Eelmine nädal">‹</button><button id="today" aria-label="Täna">Täna</button><button id="next" aria-label="Järgmine nädal">›</button></div>
  </div>
  <div class="days" id="days" role="tablist"></div>
</header>
<div id="inst" style="display:none;margin:8px 12px;padding:10px 12px;border-radius:12px;background:#2f6b4f;color:#fff;font:15px system-ui;text-align:center"></div>
<nav id="nav" class="tabs"></nav>
<main id="main"></main>
<footer class="copy">© 2026 Aleksandr Saaroja. Kõik õigused kaitstud.</footer>
<script>
let DATA=null;
const DAYS=["Esmaspäev","Teisipäev","Kolmapäev","Neljapäev","Reede","Laupäev","Pühapäev"];
const SHORT=["E","T","K","N","R","L","P"];
const MONTHS=["jaanuar","veebruar","märts","aprill","mai","juuni","juuli","august","september","oktoober","november","detsember"];
// Tsükkel: nädal alates 05.10.2026 = Nädal 2
const ANCHOR=Date.UTC(2026,9,5);
const mondayOf=d=>{const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()-((x.getUTCDay()+6)%7));return x};
const weekNo=m=>{const w=Math.round((m-ANCHOR)/(7*864e5));return (((1+w)%5)+5)%5+1};
const fmt=d=>d.getUTCDate()+"."+String(d.getUTCMonth()+1).padStart(2,"0")+"."+d.getUTCFullYear();
const now=new Date();
const todayUTC=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
let monday=mondayOf(now), sel=(now.getDay()+6)%7;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function mealRange(t){const m=t.match(/(\d+)\.(\d+)\s*$/);return m?(+m[1])*60+(+m[2]):null}
function render(){
  if(!DATA)return;
  const wn=weekNo(monday), day=DATA[wn][sel];
  const dt=new Date(monday.getTime()+sel*864e5);
  const isToday=dt.getTime()===todayUTC;
  document.getElementById("sub").textContent="Nädal "+wn+" · "+fmt(monday)+" –"+(window.UPD?" · uuendatud "+window.UPD:"");
  document.getElementById("days").innerHTML=DAYS.map((n,i)=>{
    const d=new Date(monday.getTime()+i*864e5);
    return `<button class="day${i===sel?" sel":""}${d.getTime()===todayUTC?" today":""}" data-i="${i}" role="tab"><b>${SHORT[i]}</b><span>${d.getUTCDate()}.${d.getUTCMonth()+1}</span></button>`}).join("");
  const mins=now.getHours()*60+now.getMinutes();
  const times=day.s.map(s=>mealRange(s.t));
  let cur=-1; if(isToday){times.forEach((t,i)=>{if(t!==null&&t-30<=mins)cur=i})}
  let h=`<h2 class="date">${DAYS[sel]}, ${dt.getUTCDate()}. ${MONTHS[dt.getUTCMonth()]}</h2>`;
  if(!day.s.length)h+=`<div class="empty">Menüü puudub</div>`;
  day.s.forEach((s,i)=>{
    const [name,time]=s.t.split(/\s+KELL\s+/);
    h+=`<section class="meal${i===cur?" now":""}"><h3><span>${esc(name)}</span><em>${time?"kl "+esc(time.replace(".",":")):""}</em></h3><ul>`;
    s.i.forEach(([n,q])=>{
      const v=n.match(/^(DIABEET|PEENESTATUD):\s*(.*)$/);
      const bread=/^LEIB, SAI/.test(n);
      h+=`<li class="${v?"var":""}${bread?" bread":""}"><span class="n">${v?`<span class="tag">${v[1]}</span>${esc(v[2])}`:esc(n)}</span><span class="q">${esc(q)}</span></li>`});
    h+=`</ul></section>`});
  if(day.n&&day.n.length)h+=`<div class="notes">${day.n.map(x=>`<p>${esc(x)}</p>`).join("")}</div>`;
  CURD=dt.toISOString().slice(0,10);
  if(VIEW==="q")h=`<h2 class="date">${DAYS[sel]}, ${dt.getUTCDate()}. ${MONTHS[dt.getUTCMonth()]}</h2>`+qView(day);
  if(VIEW==="s"&&!UNL)VIEW="q";
  if(VIEW==="s")h=sView();
  document.getElementById("nav").innerHTML=[["q","Kogused"],["m","Menüü"],["s","Seaded"]].map(([k,n])=>`<button data-v="${k}" class="${VIEW===k?"on":""}">${n}</button>`).join("");
  document.getElementById("main").innerHTML=h;
}
document.getElementById("days").addEventListener("click",e=>{const b=e.target.closest(".day");if(b){sel=+b.dataset.i;render();scrollTo(0,0)}});
document.getElementById("prev").onclick=()=>{monday=new Date(monday.getTime()-7*864e5);render()};
document.getElementById("next").onclick=()=>{monday=new Date(monday.getTime()+7*864e5);render()};
document.getElementById("today").onclick=()=>{monday=mondayOf(new Date());sel=(new Date().getDay()+6)%7;render()};
let sx=0;
document.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)<70)return;
  if(dx<0){if(sel<6)sel++;else{sel=0;monday=new Date(monday.getTime()+7*864e5)}}
  else{if(sel>0)sel--;else{sel=6;monday=new Date(monday.getTime()-7*864e5)}}
  render()},{passive:true});
const sub0=document.getElementById("sub");
function loadMenu(first){fetch("../menu.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{if(!first&&window.UPD===j.updated)return;DATA=j.weeks;window.UPD=j.updated;render()}).catch(()=>{if(!first)return;document.getElementById("main").innerHTML='<div class="empty">Menüü laadimine ebaõnnestus. Ava äpp võrgus vähemalt üks kord.</div>'});}loadMenu(true);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

(function(){const b=document.getElementById("inst");
if(matchMedia("(display-mode: standalone)").matches||navigator.standalone)return;
let dp=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;b.style.display="block";b.innerHTML='<b style="cursor:pointer">📲 Paigalda äpp telefoni</b>';b.onclick=()=>{dp.prompt();dp=null;b.style.display="none"}});
addEventListener("appinstalled",()=>{b.style.display="none"});
if(/iphone|ipad|ipod/i.test(navigator.userAgent)){b.style.display="block";b.innerHTML='📲 Paigaldamiseks: puuduta <b>Jaga</b> (ruut noolega) → <b>Lisa avaekraanile</b>'}
})();

// ---- Kogused ----
function LS0(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
let PINV=null;
let UNL=false;   // Seaded ja portsjonite muutmine avatakse PIN-iga
const PINH="d3d35c902665390ceb1addf0d15082f1f22112ae21c5740d8085025875b04c13";
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function askPin(){const v=prompt("Sisesta PIN");if(v===null)return false;let ok=false;try{ok=(await sha("iru"+v.trim()))===PINH}catch(e){}if(!ok){alert("Vale PIN");return false}UNL=true;PINV=v.trim();return true}
let VIEW=LS0("iru_view","q");
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let DEPS=LS("iru_deps",[{"n": "1A", "t": 28, "p": 4, "m": 2, "d": 2}, {"n": "2A/1", "t": 16, "p": 10, "m": 1, "d": 3}, {"n": "2A/2", "t": 13, "p": 2, "m": 1, "d": 2}, {"n": "2A/3", "t": 14, "p": 0, "m": 1, "d": 3}, {"n": "2B", "t": 20, "p": 4, "m": 3, "d": 4}, {"n": "2D", "t": 19, "p": 2, "m": 2, "d": 3}, {"n": "3A", "t": 27, "p": 11, "m": 0, "d": 2}, {"n": "3B", "t": 39, "p": 13, "m": 8, "d": 10}, {"n": "3C", "t": 26, "p": 10, "m": 5, "d": 6}, {"n": "3D", "t": 37, "p": 3, "m": 4, "d": 9}, {"n": "4A/1", "t": 16, "p": 8, "m": 2, "d": 1}, {"n": "4A/2", "t": 22, "p": 2, "m": 1, "d": 2}, {"n": "4A/3", "t": 10, "p": 1, "m": 3, "d": 1}, {"n": "Söökla", "t": 22, "p": 0, "m": 0, "d": 0}, {"n": "Puhvet", "t": 70, "w": 46, "p": 0, "m": 0, "d": 0}]).map(x=>({d:0,...x}));      // [{n,t,p,m}]  nimi, kliente, peenestatud, piimavaba
let CURD="";
let OVR=LS("iru_ovr",{});        // toidu kaalu muudatused

// ---- Ühine salvestus (Google Apps Script): PIN-iga tehtud muudatused näevad kõik kokad ----
const SYNC_URL="https://script.google.com/macros/s/AKfycbwgZ6GpOa0jsLnO7C_ajSYwJ-H_l6xHzMTrLUM2wqoM_quR4zAOOH0p0d8HX2fXhK2S/exec";   // pannakse siia pärast Google'i skripti avaldamist
let SH=LS("iru_sh",{ovr:{},deps:null,depsBase:null}); let SYNC_OK=null;
const OV=k=>(SH.ovr&&SH.ovr[k]!==undefined)?SH.ovr[k]:OVR[k];
function applyShared(){if(SH.deps&&typeof DEPINFO!=="undefined"&&DEPINFO&&SH.depsBase===DEPINFO.updated)DEPS=SH.deps.map(x=>({d:0,...x}))}
async function syncGet(){if(!SYNC_URL)return;try{const r=await fetch(SYNC_URL+"?t="+Date.now(),{cache:"no-store"});const j=await r.json();const old=JSON.stringify(SH);SH={ovr:j.ovr||{},deps:j.deps||null,depsBase:j.depsBase||null,ver:j.ver||0};SV("iru_sh",SH);const was=SYNC_OK;SYNC_OK=true;if(JSON.stringify(SH)!==old||was!==true){applyShared();render()}}catch(e){SYNC_OK=false}}
async function syncPost(o){if(!SYNC_URL||!PINV)return false;try{const r=await fetch(SYNC_URL,{method:"POST",body:JSON.stringify({pin:PINV,...o})});const j=await r.json();if(!j.ok){if(j.err==="pin"){PINV=null;UNL=false;alert("PIN ei sobi ühise salvestusega")}return false}return true}catch(e){alert("Ühist salvestust ei saanud uuendada (pole võrku?)");return false}}
function pushDeps(){if(UNL&&PINV&&SYNC_URL&&DEPINFO){SH.deps=DEPS;SH.depsBase=DEPINFO.updated;SV("iru_sh",SH);syncPost({action:"deps",deps:DEPS,base:DEPINFO.updated})}}

const num=v=>Math.max(0,parseInt(v)||0);
const fmtQ=(v,u)=>{const l=u==="g"?"kg":u==="ml"?"l":null;
  if(u==="ml")return (v/1000).toLocaleString("et",{minimumFractionDigits:1,maximumFractionDigits:2})+" l";
  if(l&&v>=1000)return (v/1000).toLocaleString("et",{maximumFractionDigits:2})+" "+l;
  return Math.round(v).toLocaleString("et")+" "+u};
const LIQ=/MAHL|MORSS|KOHV|TEE\b|^PIIM\s*$|KISSEL|JOOK|^KAKAO\s*$|KEFIIR|KEEFIR\s*$|SUPP|PUUL/;
let DX=[];
function effDeps(){const we=sel>=5;   // L, P: puhveti arv eraldi (w), päevahoid ei söö
  return DEPS.map(d=>/^Puhvet/i.test(d.n)?(we?{...d,t:d.w===undefined?70:d.w}:d):(we&&d.h?{...d,t:d.t-d.h}:d)).filter(d=>d.t>0||!/^Puhvet/i.test(d.n))}
function sub(val,unit,lunch,pv,noPur,pw){
  if(pv===undefined)pv=val;
  const pe=noPur?0:DX.reduce((a,d)=>a+(/^Puhvet/i.test(d.n)?0:d.p),0), pu=lunch?DX.filter(d=>/^Puhvet/i.test(d.n)).reduce((a,d)=>a+d.t,0):0;
  let r="";
  if(pe)r+=pw?`<br>sh peenestatud: ${pe} × ${pw} g = ${fmtQ(pe*pw,"g")} (${pe*val} tk)`:`<br>sh peenestatud: ${pe} × ${val} ${unit} = ${fmtQ(pe*val,unit)}`;
  if(pu)r+=pw?`<br>sh puhvet: ${pu} × ${pw} g = ${fmtQ(pu*pw,"g")} (${pu*pv} tk)`:`<br>sh puhvet: ${pu} × ${pv} ${unit} = ${fmtQ(pu*pv,unit)}`;
  return r}
function qView(day){
  DX=effDeps();
  if(!DX.length)return '<div class="empty">Lisa kõigepealt üksused: vajuta „Seaded“.</div>';
  const T=DX.reduce((a,d)=>({t:a.t+d.t,p:a.p+d.p,m:a.m+d.m,d:a.d+d.d}),{t:0,p:0,m:0,d:0});
  const PUX=DX.filter(x=>/^Puhvet/i.test(x.n)).reduce((a,x)=>a+x.t,0), SKX=DX.filter(x=>/^Söökla/i.test(x.n)).reduce((a,x)=>a+x.t,0);
  let h=(UNL&&SYNC_URL?`<div class="notes" style="margin:0 0 8px"><p>🔓 PIN sees: sinu muudatused lähevad kõikidele kokkadele.</p></div>`:"")+`<div class="chips"><div class="chip"><b>${T.t}</b><span>sööjat lõunal</span></div><div class="chip"><b>${T.p}</b><span>peenestatud</span></div><div class="chip"><b>${T.d}</b><span>suhkruvaba</span></div><div class="chip"><b>${T.m}</b><span>piimavaba</span></div></div>`;
  h+=`<section class="meal"><h3><span>OSAKONNITI</span></h3><div style="padding:4px 14px 8px"><table class="dtab"><tr><th>Üksus</th><th>Sööjaid</th><th>Peenestatud</th><th>Suhkruvaba</th><th>Piimavaba</th></tr>`+
    DX.filter(d=>d.t).map(d=>`<tr><td>${esc(d.n)}</td><td>${d.t}</td><td class="pu">${d.p||"–"}</td><td>${d.d||"–"}</td><td>${d.m||"–"}</td></tr>`).join("")+
    `<tr class="tot"><td>Kokku</td><td>${T.t}</td><td>${T.p}</td><td>${T.d}</td><td>${T.m}</td></tr></table></div></section>`;
  const PU=DX.filter(x=>/^Puhvet/i.test(x.n)).reduce((a,x)=>a+x.t,0);
  if(PU)h+=`<div class="notes" style="margin:0 0 10px"><p>Puhvet (${PU}) on arvestatud ainult lõunal. Hommikul, õhtul ja ööoodel: <b>${T.t-PU}</b> sööjat.</p></div>`;
  if(DEPINFO)h+=`<div class="notes" style="margin:0 0 10px"><p>Arvud toidulehelt, uuendatud ${esc(DEPINFO.updated)}</p></div>`;
  day.s.forEach(s=>{
    const lunch=/^LÕUNA/i.test(s.t);
    const puN=DX.filter(x=>/^Puhvet/i.test(x.n)).reduce((a,x)=>a+x.t,0), clN=DX.reduce((a,x)=>a+x.t,0)-puN;
    const cl=/^(HOMMIKU|LÕUNA|ÕHTU|ÖÖ)/i.test(s.t)?(lunch&&puN?`${clN} + ${puN} = ${clN+puN}`:`${clN}`)+" klienti":"";
    h+=`<section class="meal"><h3><span>${esc(s.t.split(/\s+KELL\s+/)[0])}${cl?` <span style="font-weight:600;opacity:.85;letter-spacing:0">· ${cl}</span>`:""}</span><em>${esc((s.t.split(/\s+KELL\s+/)[1]||"").replace(".",":"))}</em></h3><ul style="padding-top:0">`;
    s.i.forEach(([n,q])=>{
      const v=n.match(/^(DIABEET|PEENESTATUD):\s*(.*)$/);
      if(/^LEIB, SAI/.test(n))return;
      const pure=v&&v[1]==="PEENESTATUD", dia=v&&v[1]==="DIABEET", name=v?v[2]:n;
      const names=name.split(/\s*[,\/]\s*/), qs=q.split("/");
      const parts=(names.length===qs.length&&qs.length>1)?names.map((x,k)=>[x,qs[k]]):[[name,qs[0]]];
      parts.forEach(([nm,qq],k)=>{
        const key=CURD+"|"+n+"|"+k;
        let raw=(OV(key)!==undefined?OV(key):qq).toString().trim();
        if(!raw&&/^(TEE|KOHV|MAHL|KAKAO)\s*$/i.test(nm))raw="250";   // puuduv kogus: jook 250 ml
        const pc0=/TK/i.test(raw), val=parseFloat(raw)||0;
        const pc=pc0||(val>0&&val<10&&!/^(VÕI|TEE)$/i.test(nm)&&!LIQ.test(nm));   // nt „3“ = 3 tükki
        const unit=pc?"tk":LIQ.test(nm)?"ml":"g";
        const PW0=unit!=="tk"?0:/^LÕHEVORM/i.test(nm)?150:/^(KALAPALA|SARDELL|PIHV|KANAPIHV|TOORVORST|VIINER)/i.test(nm)?100:0;   // tükikaup: portsjoni kaal g (peenestatud eraldamiseks)
        const gRaw=OV(key+"|g")!==undefined?String(OV(key+"|g")):(PW0?String(PW0):""), PW=unit==="tk"?(parseFloat(gRaw)>0?parseFloat(gRaw):PW0):0;   // portsjoni kaal (g) on muudetav; tk arv on ainult infoks
        const chg=OV(key)!==undefined||OV(key+"|pu")!==undefined||OV(key+"|g")!==undefined;
        const noPur=/^SAIAKE/i.test(nm);   // peenestatud ei saa saiakest (tükikaup); salat läheb kõigile kokku
        const dairy=!pure&&!dia&&!/^HIRSIPUDER/i.test(nm)&&/(PUDER|HELBED)\s*$|^MAISIMANNA|PIIM|KEEFIR|JOGURT|KAKAO|KOHUKE|HAPUKOOR|^HK\s*$|FRIKADELLIKASTE|KARAMELLKISSELL/i.test(nm);   // piimavaba rida: pudrud ja piimatooted
        const mvOf=d=>(d.mv!==undefined?d.mv:d.m)||0;   // piimavaba, mitte-peenestatud
        const MV=DX.filter(d=>!/^Puhvet/i.test(d.n)).reduce((a,d)=>a+mvOf(d),0);
        const noSplit=(/KASTE|KETŠUP|HAPUKOOR|^HK\s*$/i.test(nm)&&[20,30,50].includes(val)&&unit==="g")||/^SALAT|KISSELL|PASTEET|KOHUPIIM\s*$|^VÕI\s*$|(PUDER|HELBED)\s*$|^KAKAO\s*$|^MAISIMANNA\s*$|^(MOOS|TOORMOOS|KEEDIS|MEREVAIK|KOHV|TEE|PIIM|KEEFIR|MAHL|MORSS)\s*$/i.test(nm);   // kastmel peenestatud eraldi ei näidata, läheb kokku
        const deps=DX.filter(d=>lunch||!/^Puhvet/i.test(d.n)).map(d=>[d.n,pure?d.p:dia?d.d:(noPur?d.t-d.p:d.t)]);
        const isPu=nn=>/^Puhvet/i.test(nn);
        const pRaw=OV(key+"|pu")!==undefined?OV(key+"|pu"):(/^SALAT/i.test(nm)?"100":raw), pv=parseFloat(pRaw)||0;
        const wt=nn=>isPu(nn)?pv:val;
        const cnt=deps.reduce((a,x)=>a+x[1],0), tot=deps.reduce((a,x)=>a+x[1]*wt(x[0]),0);
        const puC=deps.filter(x=>isPu(x[0])).reduce((a,x)=>a+x[1],0), regC=cnt-puC;
        const calc=puC&&pv!==val&&!pure&&!dia?val+" "+unit+" × "+regC+" + "+pv+" "+unit+" × "+puC:val+" "+unit+" × "+cnt;
        const tag0=pure?'<span class="tag pur">PEENESTATUD</span>':dia?'<span class="tag">DIABEET</span>':"";
        const tag=tag0+(chg?'<span class="tag">MUUDETUD</span>':"");
        h+=`<li class="qrow" style="display:block" data-nm="${esc(nm)}" data-raw="${esc(raw)}" data-unit="${unit}" data-flags="${[noSplit&&"NS",noPur&&"NP",dairy&&"DY",pure&&"PU",dia&&"DB"].filter(Boolean).join(" ")}"><details><summary><div class="qn">${tag}${esc(nm)}${PW?` <span style="font-weight:500;opacity:.8">(${PW} g)</span>`:""}<small>${val?(PW?PW+" g × "+cnt+" = "+fmtQ(cnt*PW,"g")+" <span style='opacity:.75'>(info: "+calc+" = "+fmtQ(tot,unit)+")</span>":calc+" = "+fmtQ(tot,unit))+(pure||dia?"":sub(val,unit,lunch,pv,noPur||noSplit,PW))+(dairy&&MV?`<br><span style="color:var(--warn)">sh piimavaba: ${MV} × ${val} ${unit} = ${fmtQ(MV*val,unit)}</span>`:""):"kogus puudub"}</small></div><div class="qt">${val?(PW?fmtQ(cnt*PW,"g"):fmtQ(tot,unit)):"–"}${PW&&val?`<br><small style="font-size:13px;font-weight:600;opacity:.75">${fmtQ(tot,unit)}</small>`:""}</div></summary>`+
          `<div class="qd"><label>Portsjon (menüüs: ${esc(qq)}) <input data-k="${esc(key)}" value="${esc(raw)}" inputmode="decimal"> ${unit}</label>`+(chg?`<button data-reset="${esc(key)}" style="margin:0 0 8px;padding:6px 10px;border-radius:10px;border:1px solid var(--accent);background:var(--card);color:var(--accent);font:600 13px system-ui">Lähtesta menüü väärtusele</button>`:"")+
          (unit==="tk"?`<label>Portsjoni kaal <input data-k="${esc(key+"|g")}" value="${esc(gRaw)}" inputmode="decimal"> g</label>`:"")+
          (puC?`<label>Puhveti portsjon <input data-k="${esc(key+"|pu")}" value="${esc(pRaw)}" inputmode="decimal"> ${unit}</label>`:"")+
          deps.filter(x=>x[1]).map(x=>{const u=DX.find(d=>d.n===x[0])||{}, own=!(pure||dia||isPu(x[0]));
            const pp=(own&&!noPur&&!noSplit)?(u.p||0):0, pm=(own&&dairy)?mvOf(u):0, main=x[1]-pp-pm, w=wt(x[0]), f=n=>val?(PW?(n*PW/1000).toLocaleString("et",{maximumFractionDigits:2})+" kg ("+(n*w)+" tk)":unit==="g"?(n*w/1000).toLocaleString("et",{maximumFractionDigits:2})+" kg":fmtQ(n*w,unit)):"–";
            if(!pp&&!pm)return `<div class="ln"><span>${esc(x[0])} <span style="color:var(--mute)">(${x[1]})</span></span><b>${f(x[1])}</b></div>`;
            return `<div class="ln" style="flex-wrap:wrap;gap:0 8px"><span>${esc(x[0])} <span style="color:var(--mute)">(${main})</span></span><span style="text-align:right"><b>${f(main)}</b>`+
              (pp?` <span style="color:var(--accent)">+ peenestatud (${pp}) ${f(pp)}</span>`:"")+
              (pm?` <span style="color:var(--warn)">+ piimavaba (${pm}) ${f(pm)}</span>`:"")+`</span></div>`}).join("")+`</div></details></li>`});
    });
    h+=`</ul></section>`});
  return h+'<div class="notes"><p>Puuduta rida, et näha koguseid üksuste kaupa ja muuta portsjoni kaalu.</p></div>'}
function sView(){
  const inp=(i,f,v)=>`<input data-d="${i}" data-f="${f}" value="${v}" inputmode="numeric" style="width:100%;padding:8px;border:1px solid #bbb;border-radius:8px">`;
  return `<section class="meal"><h3><span>Osakonnad</span></h3><div style="padding:8px">`+
   (DEPS.length?`<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 28px;gap:6px;font-size:12px;opacity:.7"><span>Üksus</span><span>Sööjaid</span><span>Peenest.</span><span>Piimav.</span><span>Suhkruv.</span><span></span></div>`:"")+
   DEPS.map((d,i)=>`<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 28px;gap:6px;margin:6px 0"><input data-d="${i}" data-f="n" value="${esc(d.n)}" style="padding:8px;border:1px solid #bbb;border-radius:8px">${inp(i,"t",d.t)}${inp(i,"p",d.p)}${inp(i,"m",d.m)}${inp(i,"d",d.d)}<button data-del="${i}" style="border:0;background:none;font-size:18px">✕</button></div>`).join("")+
   `<button id="addd" style="margin-top:8px;padding:10px;width:100%;border-radius:10px;border:1px dashed #2f6b4f;background:#fff;color:#2f6b4f;font:600 15px system-ui">+ Lisa üksus</button>`+
   (DEPINFO?`<p style="font-size:13px">Arvud toidulehelt, uuendatud <b>${esc(DEPINFO.updated)}</b>. Uuenevad ise, kui fail muutub. Käsitsi muudatused kehtivad kuni järgmise uuenduseni.</p>`+Object.entries(DEPINFO.dates||{}).filter(([k,v])=>v&&(Date.now()-Date.parse(v))>7*864e5).map(([k,v])=>`<p style="font-size:13px;color:#b45309">⚠ ${esc(k)} toidulehe kuupäev ${esc(v)} on üle 7 päeva vana</p>`).join(""):"")+`<p style="font-size:13px">Ühine salvestus: <b>${SYNC_URL?(SYNC_OK===false?"ei ühendu":"ühendatud"):"ei ole seadistatud"}</b>. PIN-iga tehtud muudatused (arvud ja kogused) näevad kõik kokad.</p>`+`<p style="font-size:13px;opacity:.7">Andmed (toidulehelt) salvestuvad ainult selles telefonis. Märkused: 3D 5×päevas piimavaba, riisivaba, suhkruvaba, 1 keedumuna; 3B iga päev 500 g tatart; 4A/2 päevahoid E–R on üldtoidu sees; 2D ja 4A/1 piimavaba ka laktoosivaba.</p></div></section>`}

// ---- Arvud toidulehelt (osakonnad.json uueneb automaatselt) ----
let DEPINFO=null;
function loadDeps(){fetch("osakonnad.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{
  if(DEPINFO&&DEPINFO.updated===j.updated)return;
  DEPINFO=j;
  const base=LS0("iru_deps_base","");
  if(base!==j.updated){DEPS=j.deps.map(x=>({d:0,...x}));SV("iru_deps",DEPS);try{localStorage.setItem("iru_deps_base",j.updated)}catch(e){}}
  applyShared();render();syncGet()}).catch(()=>{})}
loadDeps();
function refreshAll(){loadDeps();loadMenu(false);syncGet()}
setInterval(refreshAll,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshAll()});
document.addEventListener("click",e=>{
  const rs=e.target.closest("[data-reset]");if(rs){(async()=>{if(SYNC_URL&&!UNL){const ok=await askPin();if(!ok){alert("Muutmiseks on vaja PIN");return}}const b=rs.dataset.reset;[b,b+"|pu",b+"|g"].forEach(k=>{delete OVR[k];if(SH.ovr&&SH.ovr[k]!==undefined&&UNL&&PINV){delete SH.ovr[k];syncPost({action:"ovr",key:k,value:null})}});SV("iru_ovr",OVR);SV("iru_sh",SH);render()})();return}
  const v=e.target.closest("[data-v]");if(v){if(v.dataset.v==="s"&&!UNL){askPin().then(ok=>{if(ok){VIEW="s";render();scrollTo(0,0)}});return}VIEW=v.dataset.v;try{localStorage.setItem("iru_view",VIEW)}catch(_){}render();scrollTo(0,0);return}
  if(e.target.id==="addd"){DEPS.push({n:"Üksus "+(DEPS.length+1),t:0,p:0,m:0,d:0});SV("iru_deps",DEPS);pushDeps();render();return}
  const x=e.target.closest("[data-del]");if(x&&confirm("Kustutan osakonna?")){DEPS.splice(+x.dataset.del,1);SV("iru_deps",DEPS);pushDeps();render()}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.k!==undefined){const k=t.dataset.k,v=t.value.trim();(async()=>{if(SYNC_URL&&!UNL){const ok=await askPin();if(!ok){alert("Muutmiseks on vaja PIN");render();return}}if(UNL&&PINV&&SYNC_URL){SH.ovr=SH.ovr||{};SH.ovr[k]=v;SV("iru_sh",SH);render();syncPost({action:"ovr",key:k,value:v});return}OVR[k]=v;SV("iru_ovr",OVR);render()})();return}
  if(!UNL)return;
  if(t.dataset.d!==undefined){const d=DEPS[+t.dataset.d],f=t.dataset.f;d[f]=f==="n"?t.value:num(t.value);SV("iru_deps",DEPS);pushDeps()}});
</script>
